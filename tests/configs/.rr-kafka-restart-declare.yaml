version: '3'

rpc:
  listen: tcp://127.0.0.1:6007

server:
  command: "php php_test_files/jobs/jobs_ok.php"
  relay: "pipes"

kafka:
  brokers: ["127.0.0.1:9095"]
  group_options:
    group_id: bar-restart-declared
    block_rebalance_on_poll: true

logs:
  level: debug
  encoding: console
  mode: development

jobs:
  num_pollers: 1
  pipeline_size: 100000
  timeout: 100
  pool:
    num_workers: 5
    allocate_timeout: 60s
    destroy_timeout: 60s
  consume: []
