version: '3'

rpc:
  listen: tcp://127.0.0.1:6004

server:
  command: "php php_test_files/jobs/jobs_ok_pq.php"
  relay: "pipes"
  relay_timeout: "20s"

logs:
  level: debug
  encoding: console
  mode: development

kafka:
  brokers: ["127.0.0.1:9092"]

jobs:
  num_pollers: 4
  pipeline_size: 100000
  timeout: 100
  pool:
    num_workers: 2
    allocate_timeout: 60s
    destroy_timeout: 60s

  pipelines:
    test-serial-stop:
      driver: kafka
      config:
        priority: 1

        auto_create_topics_enable: true

        group_options:
          group_id: serial-stop
          block_rebalance_on_poll: true

        producer_options:
          required_acks: LeaderAck
          disable_idempotent: true

        consumer_options:
          topics: [ "foo-serial-stop" ]
          pipelining_strategy: Serial
          consumer_offset:
            type: AtStart

  consume: [ "test-serial-stop" ]
